server.port=8080
server.servlet.context-path=/v1/dev-tool
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.cache.disabled: false
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
# Shared upload envelope; image service applies tighter per-file and decoded-pixel limits.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=85MB
